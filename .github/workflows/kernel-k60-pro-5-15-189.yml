name: K60 Pro Android13 5.15.189 BakaSU
run-name: K60 Pro · 5.15.189-android13 · BakaSU + SUSFS

# 固定为 OS3.0.4.0.VMKCNXM 所需的 GKI 版本。
# 实际编译步骤复用 build.yml；本入口只固定版本与功能选择。
# 同步上游时核对 build.yml 的 workflow_call 输入，保留本机选择。
# BakaSU 已恢复 SUSFS 构建；在 Actions 页面手动运行。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kernel-k60-pro-5-15-189.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      android_version: android13
      kernel_version: "5.15"
      sub_level: "189"
      os_patch_level: "2025-09"
      revision: "r14"
      ksu_variant: BakaSU
      ksu_branch: main
      clean_build: false
      version: ""
      build_time: "N"
      enable_susfs: true
      use_bbg: false
      use_zram: false
      use_rekernel: false
      cve_2026_43499_patch: true
      supp_op: false
      droidspaces: "off"
      droidspaces_ntsync: false
      use_nomount: false
      build_bypass: false
